<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="stylesheet" href="_ds/nocturne-916ce8a1-fc89-47ca-9269-b7f239d3b838/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="_ds/nocturne-916ce8a1-fc89-47ca-9269-b7f239d3b838/_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
a{color:var(--color-accent)}a:hover{color:var(--color-accent-300)}
</style></helmet>

<div style="display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh;max-width:1920px;margin:0 auto">



<aside style="flex:1 1 300px;max-width:340px;min-width:280px;padding:max(10vh,var(--space-8)) var(--space-8) var(--space-8);display:flex;flex-direction:column;gap:var(--space-8);background:linear-gradient(180deg,#1b1d2b,var(--color-bg));border-right:1px solid var(--color-divider)">
<div>
<div style="font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--color-accent);margin-bottom:var(--space-3)">{{ dateLabel }}</div>
<h1 style="margin:0;font-size:38px;letter-spacing:-.02em">{{ greeting }}</h1>
</div>

<div style="display:flex;align-items:baseline;gap:var(--space-3)">
<div style="font-size:58px;line-height:1;font-weight:500;letter-spacing:-.03em">{{ clock }}</div>
<div style="font-size:12px;color:var(--color-neutral-400)">CEST</div>
</div>

<div style="padding:var(--space-6);border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm)">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)">
<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)">Weather</div>
<div style="font-size:11px;color:var(--color-neutral-400)">Nantes</div>
</div>
<div style="display:flex;align-items:center;gap:var(--space-6)">
<i class="ph-light ph-sun" style="font-size:44px;color:var(--color-accent-400)"></i>
<div>
<div style="font-size:34px;line-height:1;font-weight:500;letter-spacing:-.02em">26,3 °C</div>
<div style="font-size:12px;color:var(--color-neutral-300);margin-top:var(--space-2)">Clear · feels 27,1 °C</div>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--color-divider);font-size:12px;color:var(--color-neutral-300)">
<span>↑ 28°</span><span>↓ 17°</span><span>10 % rain</span><span>12 km/h</span>
</div>
</div>

<div style="margin-top:auto">
</div>
</aside><main style="flex:1 1 460px;min-width:280px;padding:max(10vh,var(--space-8)) var(--space-8) var(--space-8);display:flex;flex-direction:column;gap:var(--space-8)">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<section>
<span style="display:block;width:20px;height:2px;background:var(--color-accent);margin-bottom:var(--space-3)"></span>
<div style="display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)">
<div style="font-size:1.2em;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--color-neutral-200)">{{ g.name }}</div>
<div style="font-size:11px;color:var(--color-neutral-400)">{{ g.note }}</div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1em 2em;max-width:1240px">
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);min-height:44px;border-radius:var(--radius-md);color:var(--color-text)" style-hover="background:color-mix(in srgb, var(--color-accent) 14%, transparent)">
<a href="#" style="display:flex;align-items:center;gap:var(--space-4);flex:1;min-width:0;text-decoration:none;color:var(--color-text)" style-active="color:var(--color-accent-300)">
<span style="width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--color-surface);box-shadow:var(--shadow-sm);font-size:16px;color:var(--color-accent-400)"><i class="ph {{ it.ic }}"></i></span>
<span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span>
</a>
<sc-if value="{{ it.up }}" hint-placeholder-val="{{ true }}">
<a href="#" title="Uptime Kuma — up" aria-label="Status: up, open in Uptime Kuma" style="flex:none;width:9px;height:9px;border-radius:50%;background:#7fbf9a;box-shadow:0 0 0 3px color-mix(in srgb, #7fbf9a 18%, transparent)" style-hover="box-shadow:0 0 0 4px color-mix(in srgb, #7fbf9a 32%, transparent)"></a>
</sc-if>
<sc-if value="{{ it.down }}" hint-placeholder-val="{{ false }}">
<a href="#" title="Uptime Kuma — down" aria-label="Status: down, open alert in Uptime Kuma" style="flex:none;width:9px;height:9px;border-radius:50%;background:#e08585;box-shadow:0 0 0 3px color-mix(in srgb, #e08585 22%, transparent)" style-hover="box-shadow:0 0 0 4px color-mix(in srgb, #e08585 36%, transparent)"></a>
</sc-if>
<span style="font-size:11px;color:var(--color-neutral-400);flex:none">{{ it.host }}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;greeting&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Good evening&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dateLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saturday, 6 September&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clock&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;20:42&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  // status: 'up' | 'down' for links monitored in Uptime Kuma; absent = not monitored
  mark(groups) {
    groups.forEach(g => g.items.forEach(it => {
      it.up = it.status === 'up';
      it.down = it.status === 'down';
    }));
    return groups;
  }
  renderVals() {
    return {
      dateLabel: this.props.dateLabel ?? 'Saturday, 6 September',
      greeting: this.props.greeting ?? 'Good evening',
      clock: this.props.clock ?? '20:42',
      groups: this.mark([
        { name: 'Applications', note: 'self-hosted', items: [
          { label: 'Home Assistant', host: ':8123', ic: 'ph-house-line', status: 'up' },
          { label: 'Grafana', host: ':3000', ic: 'ph-chart-line', status: 'up' },
          { label: 'Vaultwarden', host: ':8080', ic: 'ph-shield-check', status: 'up' },
          { label: 'Portainer', host: ':9443', ic: 'ph-cube', status: 'up' },
          { label: 'Immich', host: ':2283', ic: 'ph-images', status: 'up' },
          { label: 'Paperless', host: ':8000', ic: 'ph-files', status: 'down' },
        ]},
        { name: 'Resources', note: 'reference', items: [
          { label: 'Documentation', host: 'docs.local', ic: 'ph-book-open', status: 'up' },
          { label: 'Wiki', host: 'wiki.local', ic: 'ph-notebook', status: 'up' },
          { label: 'Bookmarks', host: 'linkding', ic: 'ph-bookmark-simple', status: 'up' },
          { label: 'Feeds', host: 'miniflux', ic: 'ph-rss', status: 'up' },
          { label: 'Notes', host: 'obsidian', ic: 'ph-note' },
          { label: 'Cheatsheets', host: 'gist', ic: 'ph-list-checks' },
        ]},
        { name: 'Apps', note: 'daily', items: [
          { label: 'Mail', host: 'fastmail', ic: 'ph-envelope-simple' },
          { label: 'Calendar', host: 'cal', ic: 'ph-calendar-dots' },
          { label: 'Music', host: 'navidrome', ic: 'ph-music-notes', status: 'up' },
          { label: 'Chat', host: 'matrix', ic: 'ph-chat-circle' },
          { label: 'Repositories', host: 'github', ic: 'ph-git-branch' },
          { label: 'Maps', host: 'osm', ic: 'ph-map-trifold' },
        ]},
      ]),
    };
  }
}

</script>
</body>
</html>
