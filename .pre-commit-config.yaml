repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(frontend/tsconfig\.tsbuildinfo|.*\.lock|.*package-lock\.json)$
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/
        stages: [manual]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: false
      - id: pytest
        name: pytest (backend)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        stages: [pre-push]
